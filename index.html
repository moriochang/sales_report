<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銷售個績分析 · iStore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  --bg: #0b0c10;
  --surface: #13141b;
  --surface2: #1c1d27;
  --border: #272836;
  --accent: #5b7fff;
  --text: #dde1f0;
  --muted: #5a6075;
  --care: #f472b6;
  --cpu: #34d399;
  --ipad: #60a5fa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(91,127,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,127,255,0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 44px 24px 80px;
  position: relative;
}

.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 44px;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.4px;
  background: linear-gradient(130deg, #fff 20%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .sub {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-top: 5px;
}

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 18px;
  padding: 56px 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  background: var(--surface);
}
.upload-zone:hover, .upload-zone.over {
  border-color: var(--accent);
  background: rgba(91,127,255,.05);
}
.upload-zone .icon  { font-size: 38px; margin-bottom: 14px; }
.upload-zone .title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.upload-zone .hint  { font-size: 12px; color: var(--muted); }
#fileInput { display: none; }

.err {
  display: none;
  margin-top: 14px;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  color: #fca5a5;
}

#results { display: none; margin-top: 40px; }

.section-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--muted);
  margin-bottom: 10px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 32px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all .18s;
  font-family: 'DM Mono', monospace;
}
.chip:hover { border-color: var(--accent); color: #fff; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
@media(max-width:560px){ .cards { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 20px 16px;
  position: relative;
  overflow: hidden;
}
.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.c-care::after { background: var(--care); }
.card.c-cpu::after  { background: var(--cpu);  }
.card.c-ipad::after { background: var(--ipad); }
.card .lbl { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .1em; color: var(--muted); margin-bottom: 8px; }
.card .num { font-size: 38px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
.card.c-care .num { color: var(--care); }
.card.c-cpu  .num  { color: var(--cpu);  }
.card.c-ipad .num  { color: var(--ipad); }
.card .sub { font-size: 12px; color: var(--muted); }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 10px;
}
.panel-head .ptitle { font-size: 13px; font-weight: 500; }

.ftabs { display: flex; gap: 4px; }
.ftab {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--muted);
  transition: all .18s;
  font-family: 'Noto Sans TC', sans-serif;
}
.ftab:hover { border-color: var(--accent); color: var(--text); }
.ftab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--surface2); }
th {
  padding: 10px 16px;
  text-align: left;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 500;
}
td {
  padding: 11px 16px;
  font-size: 13px;
  border-top: 1px solid var(--border);
  white-space: nowrap;
}
tr:hover td { background: rgba(91,127,255,.04); }

.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.tag-care { background: rgba(244,114,182,.15); color: var(--care); }
.tag-cpu  { background: rgba(52,211,153,.15);  color: var(--cpu);  }
.tag-ipad { background: rgba(96,165,250,.15);  color: var(--ipad); }

.mono   { font-family: 'DM Mono', monospace; }
.accent { color: var(--accent); }
.qty    { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
.muted  { color: var(--muted); font-size: 12px; }
.empty  { text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }

/* ── Column filters & sort ── */
#thead-sort th {
  cursor: pointer;
  user-select: none;
  transition: color .15s;
}
#thead-sort th:hover { color: var(--accent); }
#thead-sort th.sort-asc  .si { color: var(--accent); }
#thead-sort th.sort-desc .si { color: var(--accent); }
#thead-sort th.sort-asc  .si::after { content: "↑"; }
#thead-sort th.sort-desc .si::after { content: "↓"; }

#thead-filter th { padding: 6px 10px; background: var(--bg); }
.col-filter {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 11px;
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color .15s;
}
.col-filter:focus { border-color: var(--accent); }
.col-filter::placeholder { color: var(--muted); }

/* ── Export section ── */
.export-section {
  margin-top: 32px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media(max-width:700px){ .export-section { grid-template-columns: 1fr; } }

.export-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.export-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.export-panel-head .etitle { font-size: 13px; font-weight: 500; }
.export-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  transition: all .18s;
  font-family: 'Noto Sans TC', sans-serif;
}
.export-btn:hover { border-color: var(--accent); color: var(--accent); }
.export-tbl-wrap { overflow-x: auto; }
.export-tbl-wrap.scrollable { max-height: 360px; overflow-y: auto; }
.export-tbl-wrap table { width: 100%; border-collapse: collapse; }
.export-tbl-wrap thead tr { background: var(--surface2); position: sticky; top: 0; z-index: 1; }
.export-tbl-wrap th {
  padding: 9px 14px;
  text-align: left;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 500;
}
.export-tbl-wrap td {
  padding: 9px 14px;
  font-size: 13px;
  border-top: 1px solid var(--border);
  white-space: nowrap;
}

/* ── Chart panels ── */
.chart-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}
@media(max-width:700px){ .chart-section { grid-template-columns: 1fr; } }
.chart-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.chart-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.chart-panel-head .ctitle { font-size: 13px; font-weight: 500; }
.chart-body { padding: 16px; }
.chart-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.chart-row:last-child { margin-bottom: 0; }
.chart-label {
  font-size: 11px;
  color: var(--text);
  width: 160px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chart-bar-wrap {
  flex: 1;
  background: var(--surface2);
  border-radius: 4px;
  height: 20px;
  overflow: hidden;
}
.chart-bar {
  height: 100%;
  border-radius: 4px;
  transition: width .4s ease;
  min-width: 2px;
}
.chart-bar.cpu-bar  { background: var(--cpu);  }
.chart-bar.ipad-bar { background: var(--ipad); }
.chart-val {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.chart-val.cpu-val  { color: var(--cpu);  }
.chart-val.ipad-val { color: var(--ipad); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>銷售個績分析</h1>
      <div class="sub">SALES PERFORMANCE · CPU / iPad / Care</div>
    </div>
  </div>

  <div class="upload-zone" id="zone">
    <div class="icon">📊</div>
    <div class="title" id="zoneTitle">拖曳或點擊上傳報表</div>
    <div class="hint">銷售人員個績報表byAppleReference.xlsx</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
  </div>

  <div class="err" id="err"></div>

  <div id="results">
    <div class="section-title">STORE</div>
    <div id="store-label" style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:20px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:inline-block">—</div>
    <div class="section-title">STAFF FILTER</div>
    <div class="chips" id="chips"></div>

    <div class="cards">
      <div class="card c-cpu"> <div class="lbl">CPU</div> <div class="num" id="n-cpu">—</div> <div class="sub">件數</div></div>
      <div class="card c-ipad"><div class="lbl">iPad</div><div class="num" id="n-ipad">—</div><div class="sub">件數</div></div>
      <div class="card c-care"><div class="lbl">CARE</div><div class="num" id="n-care">—</div><div class="sub">件數</div></div>
    </div>

    <!-- Chart section: CPU & iPad by 中分類 -->
    <div class="chart-section" id="chartSection" style="margin-bottom:20px">
      <div class="chart-panel">
        <div class="chart-panel-head">
          <span class="ctitle">CPU · 中分類銷售分析</span>
        </div>
        <div class="chart-body" id="chart-cpu"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-panel-head">
          <span class="ctitle">iPad · 中分類銷售分析</span>
        </div>
        <div class="chart-body" id="chart-ipad"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="ptitle">明細列表</span>
        <div class="ftabs">
          <button class="ftab on"  data-f="all"  onclick="setFilter(this)">全部</button>
          <button class="ftab"     data-f="CPU"  onclick="setFilter(this)">CPU</button>
          <button class="ftab"     data-f="iPad" onclick="setFilter(this)">iPad</button>
          <button class="ftab"     data-f="Care" onclick="setFilter(this)">Care</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr id="thead-sort">
              <th data-col="id" style="color:#fff">員工編號 <span class="si">↕</span></th>
              <th data-col="date" style="color:#fff">日期 <span class="si">↕</span></th>
              <th data-col="c1" style="color:#fff">大分類 <span class="si">↕</span></th>
              <th data-col="c2" style="color:#fff">中分類 <span class="si">↕</span></th>
              <th data-col="c3" style="color:#fff">小分類 <span class="si">↕</span></th>
              <th data-col="shortName" style="color:#fff">Short Name <span class="si">↕</span></th>
              <th data-col="qty" style="color:#fff">總計銷售數量 <span class="si">↕</span></th>
            </tr>
            <tr id="thead-filter">
              <th><input class="col-filter" data-col="id" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="date" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="c1" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="c2" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="c3" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="shortName" placeholder="篩選…"></th>
              <th><input class="col-filter" data-col="qty" placeholder="篩選…"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Export section -->
    <div class="export-section" id="exportSection">
      <!-- Table 1: CPU + iPad per staff -->
      <div class="export-panel">
        <div class="export-panel-head">
          <span class="etitle">CPU / iPad 彙總</span>
          <button class="export-btn" onclick="exportCSV('cpu-ipad')">⬇ 匯出 CSV</button>
        </div>
        <div class="export-tbl-wrap">
          <table id="exp-cpu-ipad">
            <thead><tr><th style="color:#fff;font-size:12px">員工編號</th><th style="color:#fff;font-size:12px">CPU</th><th style="color:#fff;font-size:12px">iPad</th></tr></thead>
            <tbody id="exp-ci-body"></tbody>
          </table>
        </div>
      </div>
      <!-- Table 2: Care per staff x short name -->
      <div class="export-panel">
        <div class="export-panel-head">
          <span class="etitle">Care 彙總</span>
          <button class="export-btn" onclick="exportCSV('care')">⬇ 匯出 CSV</button>
        </div>
        <div class="export-tbl-wrap">
          <table id="exp-care">
            <thead><tr id="exp-care-head"></tr></thead>
            <tbody id="exp-care-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Table 3: Daily summary CPU / iPad / Care -->
    <div class="export-panel" style="margin-top:20px">
      <div class="export-panel-head">
        <span class="etitle">每日銷售彙總</span>
        <button class="export-btn" onclick="exportCSV('daily')">⬇ 匯出 CSV</button>
      </div>
      <div class="export-tbl-wrap">
        <table id="exp-daily" style="table-layout:fixed;width:100%">
          <thead><tr><th style="color:#fff;font-size:12px;width:160px">日期</th><th style="color:#fff;font-size:12px;width:70px">季度</th><th style="color:#fff;font-size:12px;width:45px">週數</th><th style="color:#fff;font-size:12px;text-align:right;width:60px">CPU</th><th style="color:#fff;font-size:12px;text-align:right;width:60px">iPad</th><th style="color:#fff;font-size:12px;text-align:right;width:60px">Care</th></tr></thead>
          <tbody id="exp-daily-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/*
 * 第二段資料（從 "日期" header 開始）欄位索引（XLSX.js sheet_to_json header:1）：
 *   [0]  = Staff ID (A12600…)
 *   [6]  = 日期 (20260201)
 *   [8]  = 大分類
 *   [10] = 中分類
 *   [13] = 小分類
 *   [15] = Product Code
 *   [17] = Short Name
 *   [30] = 總計 銷售數量
 */

var allRows   = [];
var storeName  = '';
var curStaff  = null;
var curFilter = 'all';
var CATS = ['CPU', 'iPad', 'Care'];
var colFilters = {};   /* { colName: searchString } */
var sortCol    = null; /* column key */
var sortDir    = 1;    /* 1=asc, -1=desc */

var zone      = document.getElementById('zone');
var fileInput = document.getElementById('fileInput');

zone.addEventListener('click',     function()  { fileInput.click(); });
zone.addEventListener('dragover',  function(e) { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', function()  { zone.classList.remove('over'); });
zone.addEventListener('drop', function(e) {
  e.preventDefault(); zone.classList.remove('over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e) {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function showErr(msg) {
  var el = document.getElementById('err');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideErr() { document.getElementById('err').style.display = 'none'; }

function loadFile(file) {
  hideErr();
  document.getElementById('zoneTitle').textContent = '解析中…';
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb  = XLSX.read(new Uint8Array(e.target.result), { type: 'array', raw: true });
      var ws  = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(ws, { header: 1 });
      parseData(raw);
      document.getElementById('zoneTitle').textContent = '✓ ' + file.name;
    } catch(ex) {
      showErr('解析失敗：' + ex.message);
      document.getElementById('zoneTitle').textContent = '拖曳或點擊上傳報表';
    }
  };
  reader.readAsArrayBuffer(file);
}

function gStr(row, idx) {
  if (!row || idx >= row.length) return null;
  var v = row[idx];
  if (v === undefined || v === null) return null;
  var s = String(v).trim();
  return s === '' ? null : s;
}
function gNum(row, idx) {
  if (!row || idx >= row.length) return null;
  var v = row[idx];
  if (v === undefined || v === null || v === '') return null;
  var n = Number(v);
  return isNaN(n) ? null : n;
}

function parseData(raw) {
  allRows = [];
  storeName = (raw[1] && raw[1][5]) ? String(raw[1][5]).trim() : '';

  /* Find the section with 日期 column — look for header row containing '日期' at [6] and '大分類' at [8] */
  var sec2Start = -1;
  for (var r = 0; r < raw.length; r++) {
    var row = raw[r] || [];
    if (gStr(row, 6) === '日期' && gStr(row, 8) === '大分類') {
      sec2Start = r;
      break;
    }
  }

  if (sec2Start === -1) {
    showErr('找不到日期欄位，請確認是正確的報表格式。');
    document.getElementById('zoneTitle').textContent = '拖曳或點擊上傳報表';
    return;
  }

  /* Parse from sec2Start + 2 (skip header + sub-header row) */
  var curId   = null;
  var curDate = null;
  var curC1   = null;
  var curC2   = null;

  for (var i = sec2Start + 2; i < raw.length; i++) {
    var row = raw[i];
    if (!row) continue;

    /* Staff ID */
    var maybeId = gStr(row, 0);
    if (maybeId && /^A\d+$/.test(maybeId)) {
      curId = maybeId;
    }

    /* Date — 8-digit string like 20260201 */
    var maybeDate = gStr(row, 6);
    if (maybeDate && /^\d{8}$/.test(maybeDate)) {
      curDate = maybeDate;
    }

    /* Carry-forward category breadcrumbs */
    var c1 = gStr(row, 8);
    var c2 = gStr(row, 10);
    if (c1) curC1 = c1;
    if (c2) curC2 = c2;

    var c3        = gStr(row, 13);
    var shortName = gStr(row, 17);
    var prodCode  = gStr(row, 15);
    var qty       = gNum(row, 30);

    /* 小分類(col13)有時為空（Excel同中分類下第二個品項不填），
       改用 Product Code 判斷這筆是否有效，小分類空時用 Short Name 補 */
    if (!curId || !curC1 || !prodCode) continue;
    if (!c3) c3 = shortName || prodCode;
    if (CATS.indexOf(curC1) === -1)    continue;
    if (qty === null)                  continue;

    allRows.push({
      id:        curId,
      date:      curDate || '—',
      c1:        curC1,
      c2:        curC2 || '',
      c3:        c3,
      shortName: shortName || '',
      qty:       qty
    });
  }

  if (allRows.length === 0) {
    showErr('找不到有效數據（CPU / iPad / Care），請確認是正確的報表格式。');
    document.getElementById('zoneTitle').textContent = '拖曳或點擊上傳報表';
    return;
  }

  buildChips();
  document.getElementById('results').style.display = 'block';
  render();
}

/* ── chips ── */
function buildChips() {
  var storeEl = document.getElementById('store-label');
  if (storeEl) storeEl.textContent = storeName || '—';
  var ids = {};
  allRows.forEach(function(r) { ids[r.id] = true; });

  var el = document.getElementById('chips');
  el.innerHTML = '';

  var allChip = mkEl('div', 'chip on', '全部人員');
  allChip.addEventListener('click', function() { pick(null); });
  el.appendChild(allChip);

  Object.keys(ids).sort().forEach(function(id) {
    var c = mkEl('div', 'chip', id);
    c.dataset.id = id;
    c.addEventListener('click', function() { pick(id); });
    el.appendChild(c);
  });

  /* init sort & col-filter controls (only first time) */
  if (!document.getElementById('thead-sort').dataset.init) {
    document.getElementById('thead-sort').dataset.init = '1';
    initTableControls();
  }
}

function pick(id) {
  curStaff = id;
  document.querySelectorAll('.chip').forEach(function(c) {
    c.classList.toggle('on',
      id === null ? !c.dataset.id : c.dataset.id === id);
  });
  render();
}

function setFilter(btn) {
  curFilter = btn.dataset.f;
  document.querySelectorAll('.ftab').forEach(function(t) {
    t.classList.toggle('on', t === btn);
  });
  render();
}

function initTableControls() {
  /* sort headers */
  document.querySelectorAll('#thead-sort th').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.dataset.col;
      if (sortCol === col) {
        sortDir = -sortDir;
        th.classList.toggle('sort-asc',  sortDir ===  1);
        th.classList.toggle('sort-desc', sortDir === -1);
      } else {
        document.querySelectorAll('#thead-sort th').forEach(function(t){
          t.classList.remove('sort-asc','sort-desc');
        });
        sortCol = col; sortDir = 1;
        th.classList.add('sort-asc');
        th.querySelector('.si').textContent = '↕';
      }
      render();
    });
  });

  /* column filter inputs */
  document.querySelectorAll('.col-filter').forEach(function(inp) {
    inp.addEventListener('input', function() {
      colFilters[inp.dataset.col] = inp.value.toLowerCase().trim();
      render();
    });
  });
}

/* ── render ── */
function render() {
  var base = curStaff
    ? allRows.filter(function(r) { return r.id === curStaff; })
    : allRows;

  document.getElementById('n-care').textContent =
    base.filter(function(r){ return r.c1==='Care'; })
        .reduce(function(s,r){ return s+r.qty; }, 0);
  document.getElementById('n-cpu').textContent =
    base.filter(function(r){ return r.c1==='CPU'; })
        .reduce(function(s,r){ return s+r.qty; }, 0);
  document.getElementById('n-ipad').textContent =
    base.filter(function(r){ return r.c1==='iPad'; })
        .reduce(function(s,r){ return s+r.qty; }, 0);

  var data = curFilter === 'all'
    ? base
    : base.filter(function(r){ return r.c1 === curFilter; });

  /* column filters */
  var activeFilters = Object.keys(colFilters).filter(function(k){ return colFilters[k]; });
  if (activeFilters.length) {
    data = data.filter(function(r) {
      return activeFilters.every(function(k) {
        var val = String(r[k] !== undefined ? r[k] : '').toLowerCase();
        return val.indexOf(colFilters[k]) !== -1;
      });
    });
  }

  /* sort */
  if (sortCol) {
    data = data.slice().sort(function(a, b) {
      var av = a[sortCol], bv = b[sortCol];
      if (typeof av === 'number' && typeof bv === 'number') return sortDir * (av - bv);
      return sortDir * String(av).localeCompare(String(bv), 'zh-TW');
    });
  }

  var tbody = document.getElementById('tbody');
  if (data.length === 0) {
    tbody.innerHTML =
      '<tr><td colspan="7"><div class="empty">沒有符合的資料</div></td></tr>';
    return;
  }

  tbody.innerHTML = data.map(function(r) {
    var k = r.c1.toLowerCase();
    return '<tr>'
      + '<td class="mono accent">'  + r.id        + '</td>'
      + '<td class="mono muted">'   + r.date       + '</td>'
      + '<td><span class="tag tag-' + k + '">' + r.c1 + '</span></td>'
      + '<td class="muted">'        + r.c2         + '</td>'
      + '<td>'                      + r.c3         + '</td>'
      + '<td class="muted">'        + r.shortName  + '</td>'
      + '<td class="qty">'          + r.qty        + '</td>'
      + '</tr>';
  }).join('');

  renderExport();
  renderCharts();
}

        + '</tr>';
    }).join('')
    + '<tr style="border-top:2px solid var(--border);font-weight:700">'
    + '<td style="font-family:\'DM Mono\',monospace;color:var(--text);font-weight:700">總計</td>'
    + '<td></td><td></td>'
    + '<td class="qty" style="text-align:right;padding-right:20px;color:var(--cpu);font-weight:700;font-size:17px">'  + totalCpu  + '</td>'
    + '<td class="qty" style="text-align:right;padding-right:20px;color:var(--ipad);font-weight:700;font-size:17px">' + totalIpad + '</td>'
    + '<td class="qty" style="text-align:right;padding-right:20px;color:var(--care);font-weight:700;font-size:17px">' + totalCare + '</td>'
    + '</tr>';
  }
}

/* ── Charts ── */
function renderCharts() {
  var base = curStaff
    ? allRows.filter(function(r){ return r.id === curStaff; })
    : allRows;

  function buildChart(cat, elId, barClass, valClass) {
    var rows = base.filter(function(r){ return r.c1 === cat; });
    /* Aggregate by c2 */
    var agg = {};
    rows.forEach(function(r){
      var k = r.c2 || r.c3;
      agg[k] = (agg[k] || 0) + r.qty;
    });
    /* Sort descending */
    var items = Object.keys(agg).map(function(k){ return { label: k, val: agg[k] }; });
    items.sort(function(a,b){ return b.val - a.val; });
    var max = items.length ? items[0].val : 1;
    var el = document.getElementById(elId);
    if (!el) return;
    if (!items.length) { el.innerHTML = '<div class="empty">無資料</div>'; return; }
    el.innerHTML = items.map(function(item){
      var pct = Math.round(item.val / max * 100);
      return '<div class="chart-row">'
        + '<div class="chart-label" title="' + item.label + '">' + item.label + '</div>'
        + '<div class="chart-bar-wrap"><div class="chart-bar ' + barClass + '" style="width:' + pct + '%"></div></div>'
        + '<div class="chart-val ' + valClass + '">' + item.val + '</div>'
        + '</div>';
    }).join('');
  }

  buildChart('CPU',  'chart-cpu',  'cpu-bar',  'cpu-val');
  buildChart('iPad', 'chart-ipad', 'ipad-bar', 'ipad-val');
}

/* ── CSV export ── */
function exportCSV(type) {
  var rows = [];
  var base = curStaff
    ? allRows.filter(function(r){ return r.id === curStaff; })
    : allRows;

  var staffIds = [];
  allRows.forEach(function(r){ if (staffIds.indexOf(r.id) === -1) staffIds.push(r.id); });
  staffIds.sort();
  var staffList = curStaff ? [curStaff] : staffIds;

  if (type === 'cpu-ipad') {
    rows.push(['員工編號','CPU','iPad']);
    staffList.forEach(function(id) {
      var rr = base.filter(function(r){ return r.id === id; });
      var cpu  = rr.filter(function(r){ return r.c1==='CPU';  }).reduce(function(s,r){ return s+r.qty; },0);
      var ipad = rr.filter(function(r){ return r.c1==='iPad'; }).reduce(function(s,r){ return s+r.qty; },0);
      rows.push([id, cpu, ipad]);
    });
  } else if (type === 'daily') {
    rows.push(['日期','CPU','iPad','Care']);
    var dateSet2 = [];
    allRows.forEach(function(r){
      if (r.date && r.date !== '—' && dateSet2.indexOf(r.date) === -1) dateSet2.push(r.date);
    });
    dateSet2.sort();
    var tcpu2=0,tipad2=0,tcare2=0;
    var WD2 = ['日','一','二','三','四','五','六'];
    dateSet2.forEach(function(d){
      var y=parseInt(d.slice(0,4)),m=parseInt(d.slice(4,6))-1,day=parseInt(d.slice(6,8));
      var lbl = d + ' (' + WD2[new Date(y,m,day).getDay()] + ')';
      var dr = allRows.filter(function(r){ return r.date === d; });
      var cpu  = dr.filter(function(r){ return r.c1==='CPU';  }).reduce(function(s,r){ return s+r.qty; }, 0);
      var ipad = dr.filter(function(r){ return r.c1==='iPad'; }).reduce(function(s,r){ return s+r.qty; }, 0);
      var care = dr.filter(function(r){ return r.c1==='Care'; }).reduce(function(s,r){ return s+r.qty; }, 0);
      tcpu2+=cpu; tipad2+=ipad; tcare2+=care;
      rows.push([lbl, cpu, ipad, care]);
    });
    rows.push(['總計', tcpu2, tipad2, tcare2]);
  } else {
    var careRows = base.filter(function(r){ return r.c1==='Care'; });
    var snSet = [];
    careRows.forEach(function(r){
      var sn = r.c3 || r.shortName;
      if (snSet.indexOf(sn) === -1) snSet.push(sn);
    });
    snSet.sort();
    var careStaff = staffList.filter(function(id){
      return careRows.some(function(r){ return r.id===id; });
    });
    var pivot = {};
    careRows.forEach(function(r){
      var sn = r.c3 || r.shortName;
      if (!pivot[r.id]) pivot[r.id] = {};
      pivot[r.id][sn] = (pivot[r.id][sn] || 0) + r.qty;
    });
    /* Vertical pivot: rows = Short Name, cols = Staff ID */
    rows.push(['小分類'].concat(careStaff));
    snSet.forEach(function(sn){
      rows.push([sn].concat(careStaff.map(function(id){ return (pivot[id] && pivot[id][sn]) ? pivot[id][sn] : 0; })));
    });
  }

  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v);
      return s.indexOf(',') > -1 || s.indexOf('"') > -1 ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',');
  }).join('\n');

  /* BOM for Excel UTF-8 */
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = (type === 'cpu-ipad' ? 'cpu_ipad_summary' : 'care_summary') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function mkEl(tag, cls, html) {
  var el = document.createElement(tag);
  el.className = cls;
  el.innerHTML = html;
  return el;
}
</script>
